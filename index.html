<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday!</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #ec4899;
      --text: #f8fafc;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      width: 90%;
      text-align: center;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 35px 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      margin-top: 0;
      color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      transform: scale(1.05);
      background: #db2777;
    }

    .audio-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      margin-top: 20px;
      width: 100%;
    }

    .audio-btn:hover {
      background: var(--accent);
      color: white;
    }

    input[type="password"] {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      text-align: center;
      font-size: 1.2rem;
      width: 160px;
      margin-bottom: 15px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .letter-box {
      margin-top: 25px;
      padding: 25px;
      background: #0f172a;
      border-radius: 12px;
      border: 1px dashed var(--accent);
      text-align: left;
      line-height: 1.6;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="card">
      <h1>🎉 Secret Birthday Message</h1>
      <p style="margin-bottom: 25px; color: #94a3b8;">Enter the passcode to unlock your letter:</p>
      
      <!-- Passcode Input -->
      <input type="password" id="passcode" maxlength="10" placeholder="Enter Code">
      <button onclick="checkPasscode()">Unlock Letter 🔓</button>
      
      <!-- Hidden Letter (Reveals when correct code is entered) -->
      <div id="secretLetter" class="letter-box hidden">
        <h3 style="margin-top:0; color: var(--accent);">Dear Birthday Person,</h3>
        <p>
          Happy Birthday! Wishing you a fantastic day filled with happiness, laughter, and everything you love.
        </p>
        <p>
          Hope this year brings you so much success and joy!
        </p>
        <p style="text-align: right; font-weight: bold; margin-bottom: 20px;">
          — Sent with love ❤️
        </p>

        <!-- Background Music Section Placed Below Letter -->
        <audio id="bgMusic" loop>
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
        </audio>
        <button class="audio-btn" onclick="toggleAudio()">🎵 Play Background Music</button>

      </div>

    </div>
  </div>

  <script>
    function toggleAudio() {
      const audio = document.getElementById('bgMusic');
      if (audio.paused) { 
        audio.play(); 
      } else { 
        audio.pause(); 
      }
    }

    function checkPasscode() {
      const input = document.getElementById('passcode').value;
      
      // CHANGE "1234" TO WHATEVER PASSCODE YOU WANT
      if (input === '1234') {
        document.getElementById('secretLetter').classList.remove('hidden');
      } else {
        alert('Incorrect passcode! Try again.');
      }
    }
  </script>
</body>
</html>
